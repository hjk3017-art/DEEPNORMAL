<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>남성 활력 자가진단 테스트</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="logo">MEN'S SECRET</div>
            <h1 class="main-title">남성 활력<br><span class="highlight">자가진단 테스트</span></h1>
            <p class="subtitle">수술 없이 당신의 '타이머'를 늘릴 수 있을까요?<br>1분 만에 나의 상태를 확인해보세요.</p>
            
            <div class="stat-box">
                <div class="stat-item" style="width: 100%;">
                    <strong>13,715명</strong>
                    <span>누적 참여자</span>
                </div>
            </div>

            <button class="btn-primary" onclick="startTest()">무료 테스트 시작하기</button>
            <p class="disclaimer">※ 본 테스트는 익명으로 진행되며 데이터는 저장되지 않습니다.</p>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <p id="q-counter">1 / 5</p>
            
            <h2 id="q-title" class="q-title">질문 내용</h2>
            
            <div id="options-container" class="options-container">
                <!-- Options will be generated by JS -->
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loading-screen" class="screen">
            <div class="spinner"></div>
            <h2 class="loading-title">데이터 분석 중...</h2>
            <p class="loading-text">당신의 활력 점수를 계산하고 있습니다.</p>
            <ul class="loading-steps">
                <li id="step1" class="step">응답 데이터 수집 완료</li>
                <li id="step2" class="step">연령대 평균과 비교 중</li>
                <li id="step3" class="step">맞춤형 솔루션 탐색 중</li>
            </ul>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <div class="result-header">
                <span class="result-label">진단 결과</span>
                <h1 id="r-title" class="r-title">당신은...</h1>
            </div>
            
            <div class="gauge-container">
                <div class="gauge">
                    <div id="gauge-fill" class="gauge-fill"></div>
                </div>
                <p class="gauge-label">위험도 수준: <span id="r-level" class="highlight">심각</span></p>
            </div>

            <div class="result-desc-box">
                <p id="r-desc">상세 설명</p>
            </div>
            
            <div class="cta-box" style="background: transparent; border: none; box-shadow: none; padding: 0;">
                <a href="#" id="affiliate-link" target="_blank" rel="noopener" style="display: block; text-decoration: none;">
                    <svg viewBox="0 0 100 200" width="100%" style="max-width: 250px; display: block; margin: 0 auto;">
                        <path d="M 50 10 C 80 10 90 50 85 80 C 80 110 95 130 90 170 C 85 195 20 195 15 170 C 10 130 25 110 20 80 C 15 50 20 10 50 10 Z" fill="#000000" stroke="#ff0000" stroke-width="4"/>
                    </svg>
                </a>
            </div>
            
            <button class="btn-secondary" onclick="location.reload()">테스트 다시하기</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
